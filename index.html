  <!-- Custom Royal Styling, Metallic Gold Gradients & Reduced-Motion Safe Animations -->
  <style>
    :root {
      --color-royal-blue: #10265C;
      --color-deep-navy: #091735;
      --color-metallic-gold: #D4AF37;

    body {

    /* Sophisticated Metallic Gold Text Effect (Not bright yellow) */
    .gold-metallic-text {
      background: linear-gradient(
        135deg,
        #C59B27 0%,
        #F5E6AD 28%,
        #D4AF37 52%,
        #F7E9B7 74%,
        #AA8220 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: #D4AF37;
    }

    /* Animated Gold Underline on Navigation Hover */
    .nav-gold-underline::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-gold-underline:hover::after,
    .nav-gold-underline.active-nav::after {
      transform: scaleX(1);
    }

    /* Hide Scrollbars for Smooth Horizontal Carousels */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Elegant Entrance & Scroll Animations */
    @keyframes heroEntrance {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes scrollDot {
      0%, 100% {
        transform: translateY(0);
        opacity: 1;
      }
      50% {
        transform: translateY(10px);
        opacity: 0.35;
      }
    }

    @keyframes subtleZoom {
      0% {
        transform: scale(1.02);
      }
      100% {
        transform: scale(1.08);
      }
    }

    .animate-heroEntrance {
      animation: heroEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }

    .animate-scrollDot {
      animation: scrollDot 2s ease-in-out infinite;
    }

    .animate-subtleZoom {
      animation: subtleZoom 18s ease-in-out infinite alternate;
    }

    /* Respect Reduced-Motion Accessibility Settings (#11) */
    @media (prefers-reduced-motion: reduce) {
      *,
      ::before,
      ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Print Styles for Full Menu Download */

        color: #000000 !important;
